name: Publish

on:
  push:
    tags:
      - "core-v*"
      - "pi-v*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish (core | pi | both)"
        required: true
        default: "both"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve target package
        id: target
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            case "$tag" in
              core-v*) pkgs=core ;;
              pi-v*)   pkgs=pi   ;;
              *)       pkgs=both ;;
            esac
          else
            pkgs="${{ inputs.package }}"
          fi
          echo "pkgs=$pkgs" >> "$GITHUB_OUTPUT"
          if [[ "$pkgs" == core || "$pkgs" == both ]]; then
            echo "core=true" >> "$GITHUB_OUTPUT"
          else
            echo "core=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$pkgs" == pi || "$pkgs" == both ]]; then
            echo "pi=true" >> "$GITHUB_OUTPUT"
          else
            echo "pi=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish core
        if: steps.target.outputs.core == 'true'
        run: npm publish --workspace packages/core --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish pi
        if: steps.target.outputs.pi == 'true'
        run: npm publish --workspace packages/pi --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
